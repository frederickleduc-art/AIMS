'use strict';const KEY='virtual-ecrew-v1';const initial={profile:{name:'Virtual Pilot',crewId:'SIM-001',base:'EGKK',rank:'First Officer',fleet:'A320 Family',timezone:'Europe/London'},entries:[],flights:[],briefings:{},checkins:{}};let data;try{const parsed=JSON.parse(localStorage.getItem(KEY));data=parsed&&Array.isArray(parsed.entries)&&Array.isArray(parsed.flights)?{...structuredClone(initial),...parsed,profile:{...initial.profile,...parsed.profile}}:structuredClone(initial)}catch{data=structuredClone(initial)}let tab='roster',month=new Date().toISOString().slice(0,7),selectedDay=new Date().toISOString().slice(0,10);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Storage is full or unavailable. Export a backup before closing.')}},uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),dateUTC=s=>new Date(s+'Z'),today=()=>new Date().toISOString().slice(0,10),addDays=(d,n)=>{let x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)},fmtDay=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',timeZone:'UTC'}),hm=s=>s?s.slice(11,16):'—',mins=(a,b)=>a&&b?Math.max(0,Math.round((dateUTC(b)-dateUTC(a))/60000)):0,clock=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),local=s=>{if(!s)return '—';try{return new Intl.DateTimeFormat('en-GB',{timeZone:data.profile.timezone,hour:'2-digit',minute:'2-digit',hour12:false}).format(dateUTC(s))}catch{return hm(s)}},sort=(a,b)=>String(a.start||a.off||a.date).localeCompare(String(b.start||b.off||b.date));data.briefings=data.briefings&&typeof data.briefings==='object'&&!Array.isArray(data.briefings)?data.briefings:{};function showTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));rende lass="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}`;for(let i=0;i<Math.ceil((first+count)/7)*7;i++){const d=addDays(`${month}-01`,i-first),other=!d.startsWith(month),es=data.entries.filter(e=>e.date===d),fs=data.flights.filter(f=>f.off.startsWith(d));html+=`<button class="day ${other?'other':''} ${d===today()?'current':''}" onclick="selectedDay='${d}';dayDetails('${d}')"><span class="num">${Number(d.slice(8))}</span>${es.slice(0,2).map(e=>`<span class="pill ${e.type==='OFF'?'off':['STANDBY','RESERVE'].includes(e.type)?'standby':e.type==='TRAINING'?'training':''}">${esc(e.label||e.type)}</span>`).join('')}${fs.slice(0,2).map(f=>`<span class="pill">${esc(f.number||'FLT')} ${esc(f.to)}</span>`).join('')}${es.length+fs.length>4?'<span class="pill">+'+(es.length+fs.length-4)+'</span>':''}</button>`}return html+'</div><p class="hint">Tap a date to view its daily roster.</p></div>'}function changeMonth(n){const [y,m]=month.split('-').map(Number);month=new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7);render()}function logbook(){let flights=[...data.flights].sort((a,b)=>b.off.localeCompare(a.off)),total=flights.filter(f=>f.completed).reduce((s,f)=>s+mins(f.off,f.on),0);let html=head('Flight Logbook',btn('+ Flight','editFlight()', 'orange'));html+=`<div class="stats" style="margin-bottom:14px"><div class="stat"><b>${flights.filter(f=>f.completed).length}</b><span>Completed flights</span></div><div class="stat"><b>${clock(total)}</b><span>Logged block hours</span></div></div><div class="panel" style="padding:0">`;html+=flights.length?flights.map(f=>`<div class="flight-card"><div class="flight-top"><div><div class="flight-route">${esc(f.from)} → ${esc(f.to)}</div><strong>${esc(f.number||'Flight')}</strong> <span class="tag">${f.completed?'Completed':'Planned'}</span></div><button class="btn light small" onclick="editFlight('${f.id}')">Edit</button></div><div class="flight-details">${esc(f.off.slice(0,10))} · ${hm( ile.name||'Pilot')+"'s roster";$('content').innerHTML=({roster,calendar,logbook,stats,profile})[tab]()}function field(label,name,type='text',value='',extra=''){return `<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function editEntry(id){const e=data.entries.find(x=>x.id===id)||{id:'',date:selectedDay,type:'DUTY',label:'',start:selectedDay+'T09:00',end:selectedDay+'T17:00',notes:''};modal(`<div class="modal-head"><h2>${id?'Edit':'Add'} Duty / Activity</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitEntry(event,'${id||''}')"><div class="grid2">${field('Date','date','date',e.date,'required')}<div><label>Activity type</label><select name="type">${['DUTY','OFF','STANDBY','RESERVE','TRAINING','VACATION','OTHER'].map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select></div>${field('Start (UTC)','start','datetime-local',e.start)}${field('End (UTC)','end','datetime-local',e.end)}</div>${field('Title (optional)','label','text',e.label)}<label>Notes</label><textarea name="notes" rows="3">${esc(e.notes)}</textarea><div class="row right" style="margin-top:16px">${id?btn('Delete',`deleteEntry('${id}')`,'danger'):''}<button class="btn orange" type="submit">Save Activity</button></div></form>`)}function submitEntry(ev,id){ev.preventDefault();const f=new FormData(ev.target),e={id:id||uid(),date:String(f.get('date')),type:String(f.get('type')),start:String(f.get('start')),end:String(f.get('end')),label:String(f.get('label')).trim(),notes:String(f.get('notes')).trim()};if(e.start&&e.end&&mins(e.start,e.end)===0&&e.start!==e.end){alert('End must be after start.');return}if(e.start&&e.end&&e.end<e.start){alert('End must be after start.');return}data.entries=id?data.entries.map(x=>x.id===id?e:x):[...data.entries,e];save();closeModal();render()}function deleteEntry(id){if(!confirm('Delete this activity?'))return;data.entries=data.entries.filter(x=>x.id!==id);save();closeModal();render()}function dayDetails(d){selectedDay=d;const fs=data.flights.filter(f=>f.off.startsWith(d)).sort((a,b)=>a.off.localeCompare(b.off)),es=data.entries.filter(e=>e.date===d);const detail=(label,value)=>`<div style="padding:7px 0;border-bottom:1px solid #e8edf0"><strong>${label}</strong><div>${esc(value||'Not assigned')}</div></div>`;let html=`<div class="modal-head"><h2>${fmtDay(d)} · Duty Details</h2><button class="close" onclick="closeModal()">×</button></div>`;if(es.length)html+=`<div class="panel">${es.map(e=>`<strong>${esc(e.label||e.type)}</strong> · ${e.start?hm(e.start)+'–'+hm(e.end)+' UTC':'All day'}`).join('<br>')}</div>`;if(!fs.length)html+='<p>No flights assigned to this day.</p>';for(const f of fs){html+=`<div class="panel" style="margin-bottom:12px"><h3>✈ ${esc(f.number)} · ${esc(f.from)} → ${esc(f.to)}</h3><div class="grid2">${detail('Aircraft',f.aircraft)}${detail('Registration',f.registration)}${detail('Departure gate',f.gate)}${detail('Arrival gate',f.arrivalGate)}${detail('Off-block UTC',hm(f.off))}${detail('On-block UTC',hm(f.on))}${detail('Block time',clock(mins(f.off,f.on)))}</div><h3>Assigned Crew</h3>${detail('Rotation / Pairing',f.rotationId)}${detail('Captain',f.captain)}${detail('First Officer',f.firstOfficer)}${detail('Cabin Manager',f.cabinManager)}${detail('Cabin Crew',f.cabinCrew)}<div class="row right" style="margin-top:12px">${btn('Edit aircraft, gates & crew',`editFlight('${f.id}')`,'orange')}${btn('Crew List / Pairing',`crewList('${f.id}')`,'light')}${btn('Crew Briefing',`crewBriefing('${f.id}')`,'light')}${btn('Crew Check-In',`crewCheckIn('${f.id}')`,'light')}</div></div>`}html+=`<div class="row right">${btn('+ Add flight',`editFlight()`,'orange')}</div>`;modal(html)}
function editFlight(id){const f=data.flights.find(x=>x.id===id)||{id:'',number:'U2',from:'EGKK',to:'',off:selectedDay+'T12:00',on:selectedDay+'T14:00',aircraft:'A320',registration:'',completed:false,notes:''};modal(`<div class="modal-head"><h2>${id?'Edit':'Add'} Flight</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitFlight(event,'${id||''}')"><div class="grid2">${field('Flight number','number','text',f.number,'required')}${field('Aircraft type','aircraft','text',f.aircraft)}${field('Departure ICAO','from','text',f.from,'required')}${field('Arrival ICAO','to','text',f.to,'required')}${field('Off-block UTC','off','datetime-local',f.off,'required')}${field('On-block UTC','on','datetime-local',f.on,'required')}${field('Registration','registration','text',f.registration)}${field('Rotation / Pairing ID','rotationId','text',f.rotationId||'','placeholder="e.g. EZY-LGW-1010-A"')}${field('Departure gate','gate','text',f.gate||'')}${field('Arrival gate','arrivalGate','text',f.arrivalGate||'')}${field('Captain','captain','text',f.captain||'')}${field('First Officer','firstOfficer','text',f.firstOfficer||'')}${field('Cabin Manager','cabinManager','text',f.cabinManager||'')}${field('Cabin Crew (comma separated)','cabinCrew','text',f.cabinCrew||'')}</div><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="completed" style="width:auto" ${f.completed?'checked':''}> Completed / logged flight</label><label>Notes</label><textarea name="notes" rows="3">${esc(f.notes)}</textarea><div class="row right" style="margin-top:16px">${id?btn('Delete',`deleteFlight('${id}')`,'danger'):''}<button class="btn orange" type="submit">Save Flight</button></div></form>`)}function submitFlight(ev,id){ev.preventDefault();const f=new FormData(ev.target),x={id:id||uid(),number:String(f.get('number')).trim().toUpperCase(),from:String(f.get('from')).trim().toUpperCase(),to:String(f.get('to')).trim().toUpperCase(),off:String(f.get('off')),on:String(f.get('on')),aircraft:String(f.get('aircraft')).trim(),registration:String(f.get('registration')).trim().toUpperCase(),rotationId:String(f.get('rotationId')||'').trim().toUpperCase(),gate:String(f.get('gate')||'').trim().toUpperCase(),arrivalGate:String(f.get('arrivalGate')||'').trim().toUpperCase(),captain:String(f.get('captain')||'').trim(),firstOfficer:String(f.get('firstOfficer')||'').trim(),cabinManager:String(f.get('cabinManager')||'').trim(),cabinCrew:String(f.get('cabinCrew')||'').trim(),completed:f.has('completed'),notes:String(f.get('notes')).trim()};if(x.on<=x.off){alert('On-block must be later than off-block.');return}data.flights=id?data.flights.map(y=>y.id===id?x:y):[...data.flights,x];if(x.rotationId){const peer=data.flights.find(y=>y.id!==x.id&&y.rotationId===x.rotationId);if(peer){for(const k of ['captain','firstOfficer','cabinManager','cabinCrew'])if(!x[k])x[k]=peer[k]||''}}save();closeModal();render()}function crewList(id){const f=data.flights.find(x=>x.id===id);if(!f)return;const pair=f.rotationId||'';const related=pair?data.flights.filter(x=>x.rotationId===pair):[f];const fieldCrew=(title,key)=>`<div><label>${title}</label><input name="${key}" value="${esc(f[key]||'')}" placeholder="Not assigned"></div>`;modal(`<div class="modal-head"><h2>👥 Crew List · ${esc(pair||f.number)}</h2><button class="close" onclick="closeModal()">×</button></div><p class="hint">Assign the same crew to every flight in this pairing. Aircraft registrations and gates remain separate for each flight.</p><div class="panel"><strong>Flights in pairing</strong>${related.map(x=>`<div class="entry-meta" style="padding:5px 0">${esc(x.number)} · ${esc(x.from)} → ${esc(x.to)} · ${esc(x.off.slice(0,10))}</div>`).join('')}</div><form onsubmit="saveCrewList(event,'${esc(f.id)}')"><div class="grid2">${fieldCrew('Captain','captain')}${fieldCrew('First Officer','firstOfficer')}${fieldCrew('Cabin Manager','cabinManager')}${fieldCrew('Cabin Crew (comma separated)','cabinCrew')}</div><p class="hint">${pair?'Saving updates '+related.length+' flight(s) in this pairing.':'Set a Rotation / Pairing ID when editing flights to link multiple sectors.'}</p><div class="row right"><button class="btn orange" type="submit">Save Crew to Pairing</button></div></form>`)}function saveCrewList(ev,id){ev.preventDefault();const f=data.flights.find(x=>x.id===id);if(!f)return;const form=new FormData(ev.target),fields=['captain','firstOfficer','cabinManager','cabinCrew'];for(const x of data.flights){if(x.id===id||(f.rotationId&&x.rotationId===f.rotationId))for(const k of fields)x[k]=String(form.get(k)||'').trim()}save();closeModal();render()}
function crewBriefing(id){const f=data.flights.find(x=>x.id===id);if(!f)return;const pair=f.rotationId||f.id,related=(f.rotationId?data.flights.filter(x=>x.rotationId===f.rotationId):[f]).sort((a,b)=>a.off.localeCompare(b.off));const b=data.briefings[pair]||{};const inp=(label,key,type='text',placeholder='')=>`<div><label>${label}</label><input name="${key}" type="${type}" value="${esc(b[key]||'')}" placeholder="${esc(placeholder)}"></div>`;modal(`<div class="modal-head"><h2>📋 Crew Briefing · ${esc(f.rotationId||f.number)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="panel"><strong>Assigned sectors</strong>${related.map(x=>`<div class="entry-meta" style="padding:6px 0;border-bottom:1px solid #e8edf0">${esc(x.number)} · ${esc(x.from)} → ${esc(x.to)} · ${esc(x.off.replace('T',' '))} UTC<br>${esc(x.aircraft||'TBA')} ${esc(x.registration||'')} · Gate ${esc(x.gate||'TBA')}</div>`).join('')}</div><div class="panel"><h3>Assigned crew</h3><div class="entry-meta">Captain: ${esc(f.captain||'Not assigned')}<br>First Officer: ${esc(f.firstOfficer||'Not assigned')}<br>Cabin Manager: ${esc(f.cabinManager||'Not assigned')}<br>Cabin Crew: ${esc(f.cabinCrew||'Not assigned')}</div><div class="row right" style="margin-top:12px">${btn('Edit Crew List',`crewList('${f.id}')`,'light')}</div></div><form onsubmit="saveCrewBriefing(event,'${f.id}')"><div class="grid2">${inp('Report time (UTC)','reportTime','datetime-local')}${inp('Report location','reportLocation','text','Crew reporting room')}${inp('Briefing time (UTC)','briefingTime','datetime-local')}${inp('Briefing location','briefingLocation','text','Briefing room / gate')}${inp('Duty end (UTC)','dutyEnd','datetime-local')}${inp('Dispatcher / contact','dispatch','text','Simulation dispatch')}</div><label>Operational briefing / weather / NOTAM notes</label><textarea name="opsNotes" rows="4" placeholder="Weather, alternates, fuel, operational notes...">${esc(b.opsNotes||'')}</textarea><label>Cabin briefing / special instructions</label><textarea name="cabinNotes" rows="3" placeholder="Passenger information, special handling, cabin notes...">${esc(b.cabinNotes||'')}</textarea><div class="row right" style="margin-top:16px"><button class="btn orange" type="submit">Save Crew Briefing</button></div></form><p class="hint">Simulation only. All briefing details are entered manually and shared across sectors with the same Pairing ID.</p>`)}function saveCrewBriefing(ev,id){ev.preventDefault();const f=data.flights.find(x=>x.id===id);if(!f)return;const form=new FormData(ev.target),key=f.rotationId||f.id;data.briefings[key]={};for(const field of ['reportTime','reportLocation','briefingTime','briefingLocation','dutyEnd','dispatch','opsNotes','cabinNotes'])data.briefings[key][field]=String(form.get(field)||'').trim();save();crewBriefing(id)}

function crewCheckIn(id){const f=data.flights.find(x=>x.id===id);if(!f)return;const key=f.rotationId||f.id;const related=(f.rotationId?data.flights.filter(x=>x.rotationId===f.rotationId):[f]).sort((a,b)=>a.off.localeCompare(b.off));const existing=data.checkins?.[key]||{};const crew=[['Captain',f.captain],['First Officer',f.firstOfficer],['Cabin Manager',f.cabinManager],...String(f.cabinCrew||'').split(',').map((name,i)=>['Cabin Crew '+(i+1),name.trim()]).filter(x=>x[1])];const statusOptions=['Not Reported','Reported','Briefed','Ready for Duty'];const rows=crew.map(([role,name],i)=>{const k=role+'|'+name,rec=existing[k]||{},status=rec.status||'Not Reported';return `<div class="panel" style="margin-bottom:10px"><strong>${esc(role)}</strong><div class="entry-meta">${esc(name||'Not assigned')}</div><label for="checkin_${i}">Check-in status</label><select id="checkin_${i}" data-crewkey="${esc(k)}">${statusOptions.map(v=>`<option value="${v}" ${v===status?'selected':''}>${v}</option>`).join('')}</select><div class="entry-meta" style="margin-top:7px">Last updated: ${esc(rec.updated||'Not yet recorded')}</div></div>`}).join('');const ready=crew.filter(([role,name])=>existing[role+'|'+name]?.status==='Ready for Duty').length;const count=crew.length;modal(`<div class="modal-head"><h2>✅ Crew Check-In</h2><button class="close" onclick="closeModal()">×</button></div><p class="hint">Pairing: ${esc(f.rotationId||f.number)} · ${related.length} sector(s)</p><div class="panel"><strong>Assigned flights</strong>${related.map(x=>`<div class="entry-meta" style="padding:5px 0">${esc(x.number)} · ${esc(x.from)} → ${esc(x.to)}</div>`).join('')}</div><div class="panel" style="background:#e9f4fb"><strong>Duty readiness: ${ready} / ${count} crew ready</strong><div style="height:9px;background:#d0e1eb;border-radius:8px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${count?100*ready/count:0}%;background:#26855a"></div></div><p class="hint">${count&&ready===count?'All assigned crew ready for duty':'Crew reporting in progress'}</p></div><p class="hint">Update each crew member's simulated reporting status. Times are recorded in UTC when you save a change.</p><form onsubmit="saveCrewCheckIn(event,'${esc(f.id)}')">${rows}<div class="row right"><button type="submit" class="btn orange">Save Crew Check-In</button></div></form><p class="hint">Simulation only — not connected to airline crew operations.</p>`)}
function saveCrewCheckIn(ev,id){ev.preventDefault();const f=data.flights.find(x=>x.id===id);if(!f)return;const key=f.rotationId||f.id;data.checkins=data.checkins||{};const old=data.checkins[key]||{},next={};for(const select of ev.target.querySelectorAll('select[data-crewkey]')){const k=select.dataset.crewkey,previous=old[k],status=select.value;next[k]={status,updated:previous?.status===status?previous.updated:new Date().toISOString().slice(0,16).replace('T',' ')+' UTC'}}data.checkins[key]=next;save();crewCheckIn(id)}
function deleteFlight(id){if(!confirm('Delete this flight?'))return;data.flights=data.flights.filter(x=>x.id!==id);save();closeModal();render()}function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function exportJSON(){download('easyjet-crew-roster-backup.json',JSON.stringify(data,null,2),'application/json')}function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}function exportCSV(){const cols=['rotationId','number','from','to','off','on','aircraft','registration','gate','arrivalGate','captain','firstOfficer','cabinManager','cabinCrew','completed','notes'];download('easyjet-flight-logbook.csv',[cols.join(','),...data.flights.map(f=>cols.map(k=>csvCell(f[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')}function exportICS(){const safe=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'),stamp=s=>s.replace(/[-:]/g,'')+'00Z',dateOnly=s=>s.replace(/-/g,'');let rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Virtual eCrew//Simulation Roster//EN','CALSCALE:GREGORIAN'];for(const e of data.entries){let allday=!e.start||!e.end||['OFF','VACATION'].includes(e.type);rows.push('BEGIN:VEVENT','UID:'+e.id+'@virtual-ecrew','DTSTAMP:'+stamp(new Date().toISOString().slice(0,16)),'SUMMARY:'+safe(e.label||e.type));if(allday)rows.push('DTSTART;VALUE=DATE:'+dateOnly(e.date),'DTEND;VALUE=DATE:'+dateOnly(addDays(e.date,1)));else rows.push('DTSTART:'+stamp(e.start),'DTEND:'+stamp(e.end));rows.push('DESCRIPTION:'+safe(e.notes),'END:VEVENT')}for(const f of data.flights)rows.push('BEGIN:VEVENT','UID:'+f.id+'@virtual-ecrew','DTSTAMP:'+stamp(new Date().toISOString().slice(0,16)),'DTSTART:'+stamp(f.off),'DTEND:'+stamp(f.on),'SUMMARY:'+safe(f.number+' '+f.from+'-'+f.to),'DESCRIPTION:'+safe(f.aircraft+' '+f.registration+' '+f.notes),'END:VEVENT');rows.push('END:VCALENDAR');download('easyjet-crew-roster.ics',rows.join('\r\n')+'\r\n','text/calendar;charset=utf-8')}async function importJSON(ev){const file=ev.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x||!Array.isArray(x.entries)||!Array.isArray(x.flights)||!x.profile||typeof x.profile!=='object')throw Error('Invalid backup');if(!confirm('Replace all current data with this backup?'))return;data={profile:{...initial.profile,...x.profile},entries:x.entries,flights:x.flights,briefings:x.briefings&&typeof x.briefings==='object'?x.briefings:{},checkins:x.checkins&&typeof x.checkins==='object'?x.checkins:{}};save();render();alert('Backup imported successfully.')}catch(e){alert('Could not import backup: '+e.message)}}function clearData(){if(!confirm('Permanently erase ALL locally stored roster and logbook data? Export a backup first.'))return;data=structuredClone(initial);save();render()}render();
</script></body></html>
